# Render Blueprint: the whole app (React + API) in one web service, plus PostgreSQL and Redis.
# MongoDB is supplied by you (free MongoDB Atlas): paste its connection string as MONGO_URL when Render asks.
# The AI model (Ollama) cannot run on a free cloud server: the assistant shows "local AI model is not connected"
# and everything else (dashboard, devices, alerts, prediction, reports, firmware, incidents, users, audit) works.
services:
  - type: web
    name: iot-sentinel
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false                 # paste the MongoDB Atlas connection string here
      - key: DATABASE_URL
        fromDatabase:
          name: iot-sentinel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: iot-sentinel-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SIMULATOR
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_PRIVATE_WEBHOOKS
        value: "false"
      # --- AI assistant (optional). Free option: Google Gemini through its OpenAI-compatible API.
      #     Create a key at https://aistudio.google.com/apikey and paste it as LLM_API_KEY when Render asks.
      #     Leave LLM_API_KEY empty and the assistant simply says "The AI model is not connected" while everything else works.
      #     NOTE: with this setting questions and uploaded documents are sent to Google (Ollama on your own PC keeps them local).
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_DIM
        value: "1024"

  - type: keyvalue
    name: iot-sentinel-redis
    plan: free
    ipAllowList: []                  # only services in this Render account can connect

databases:
  - name: iot-sentinel-db
    plan: free
    databaseName: iotmonitor
    user: iot
